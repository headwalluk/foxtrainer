id          = "feel.new-tab"
title       = "A quiet new tab page"
description = "No stories, no weather and no shortcuts on the new tab page; just the search box."
when        = { feel = ["lean", "balanced"] }

[[pick]]
source = "betterfox"
file   = "user.js"
prefs  = [
  "browser.newtabpage.activity-stream.feeds.section.topstories",
  "browser.newtabpage.activity-stream.default.sites",
]

# Firefox 158's redesigned new tab toggles weather with widgets.weather.enabled; older pages use
# showWeather. The feed switch stops the weather requests themselves.
# feeds.topsites is the Customize panel's "Shortcuts" toggle.
[prefs]
"browser.newtabpage.activity-stream.widgets.weather.enabled" = false
"browser.newtabpage.activity-stream.showWeather"             = false
"browser.newtabpage.activity-stream.feeds.weatherfeed"       = false
"browser.newtabpage.activity-stream.feeds.topsites"          = false
